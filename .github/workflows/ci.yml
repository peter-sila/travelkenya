name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  php-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
      - name: Find PHP files and lint
        run: |
          set -e
          files=$(git ls-files '*.php' || true)
          if [ -z "$files" ]; then echo "No PHP files"; exit 0; fi
          for f in $files; do
            echo "Linting $f";
            php -l "$f";
          done
