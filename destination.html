<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Search for Tour - Destination Makueni</title>
  <link rel="shortcut icon" href="assets/logo.png" type="image/x-icon">
  <link rel="stylesheet" href="css/destination.css">
  <link rel="stylesheet" href="static/css/header.css">
  <link rel="stylesheet" href="static/css/footer.css">
</head>
<body>
  <div id="header"></div>

  <section class="search-section">
    <h1>Search for tour</h1>
    <form class="search-form">
      <input type="text" placeholder="Where are you going?" />
      <input type="date" />
      <input type="date" />
      <button type="submit">Search</button>
    </form>
  </section>

  <main class="content">
    <aside class="filters">
      <h3>Filter By</h3>

      <div class="filter-group">
        <label>Price Range</label>
        <input type="range" min="0" max="50000" value="25000" />
      </div>

      <div class="filter-group">
        <label>Rating</label>
        <div>
          ★★★★★<br/>
          ★★★★☆<br/>
          ★★★☆☆
        </div>
      </div>

      <div class="filter-group">
        <label>Tour Type</label>
        <div>
          <input type="checkbox" /> Day Trip<br/>
          <input type="checkbox" /> Hiking<br/>
          <input type="checkbox" /> Museum
        </div>
      </div>
    </aside>

    <section class="tour-list">
      <h2>Tours Found</h2>

      <div class="tour-grid" id="destinations-container">

      </div>
    </section>
  </main>

  <footer id="footer"></footer>
  <script src="js/home.js"></script>
</body>
</html>
