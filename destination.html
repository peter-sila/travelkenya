<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Search for Tour - Destination Makueni</title>
  <link rel="shortcut icon" href="assets/system/logo.png" type="image/x-icon"><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr" crossorigin="anonymous">  
  <link rel="stylesheet" href="css/destinations.css">
  <link rel="stylesheet" href="static/css/header.css">
  <link rel="stylesheet" href="static/css/footer.css">
</head>
<body>
  <div id="header"></div>

  <section class="search-section">
    <h1>Search for tour</h1>
    <form class="search-form" id="search-form">
      <input type="text" id="search-input" placeholder="Where are you going?" />
      <button type="submit" id="search-dest-btn">Search</button>
    </form>
  </section>

  <main class="content">
    <div class="menu">
      <button class="btn-toggle" id="filter-toggle">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-menu-button-wide" viewBox="0 0 16 16">
          <path d="M0 1.5A1.5 1.5 0 0 1 1.5 0h13A1.5 1.5 0 0 1 16 1.5v2A1.5 1.5 0 0 1 14.5 5h-13A1.5 1.5 0 0 1 0 3.5zM1.5 1a.5.5 0 0 0-.5.5v2a.5.5 0 0 0 .5.5h13a.5.5 0 0 0 .5-.5v-2a.5.5 0 0 0-.5-.5z"/>
          <path d="M2 2.5a.5.5 0 0 1 .5-.5h3a.5.5 0 0 1 0 1h-3a.5.5 0 0 1-.5-.5m10.823.323-.396-.396A.25.25 0 0 1 12.604 2h.792a.25.25 0 0 1 .177.427l-.396.396a.25.25 0 0 1-.354 0M0 8a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2H2a2 2 0 0 1-2-2zm1 3v2a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-2zm14-1V8a1 1 0 0 0-1-1H2a1 1 0 0 0-1 1v2zM2 8.5a.5.5 0 0 1 .5-.5h9a.5.5 0 0 1 0 1h-9a.5.5 0 0 1-.5-.5m0 4a.5.5 0 0 1 .5-.5h6a.5.5 0 0 1 0 1h-6a.5.5 0 0 1-.5-.5"/>
        </svg>
        <span>Filter</span>
      </button>
    </div>
    <aside class="filters">
      <h3>Filter By</h3>

      <div class="filter-group">
        <label>Price Range (Max: <span id="priceValue">25000</span>)</label>
        <input type="range" id="priceFilter" min="0" max="50000" value="25000" />
      </div>

      <div class="filter-group">
        <label>Rating</label>
        <div>
          <input type="checkbox" name="rating" value="5" /> ★★★★★<br/>
          <input type="checkbox" name="rating" value="4" /> ★★★★☆<br/>
          <input type="checkbox" name="rating" value="3" /> ★★★☆☆<br/>
          <input type="checkbox" name="rating" value="2" /> ★★☆☆☆<br/>
          <input type="checkbox" name="rating" value="1" /> ★☆☆☆☆<br/>
        </div>
      </div>

      <div class="filter-group">
        <label>Tour Type</label>
        <div>
          <input type="checkbox" name="tourType" value="Day Trip" /> Day Trip<br/>
          <input type="checkbox" name="tourType" value="Hiking" /> Hiking<br/>
          <input type="checkbox" name="tourType" value="Museum" /> Museum<br/>
          <input type="checkbox" name="tourType" value="Cultural Tour" /> Cultural Tour<br/>
          <input type="checkbox" name="tourType" value="Wildlife Safari" /> Wildlife Safari<br/>
          <input type="checkbox" name="tourType" value="Beach Tour" /> Beach Tour<br/>
          <input type="checkbox" name="tourType" value="Adventure Tour" /> Adventure Tour<br/>
          <input type="checkbox" name="tourType" value="Historical Tour" /> Historical Tour<br/>
        </div>
      </div>
    </aside>

    <section class="tour-list">
      <h2>Tours Found</h2>
      <div id="loadingSpinner" style="display: none;">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-arrow-clockwise" viewBox="0 0 16 16">
          <path fill-rule="evenodd" d="M8 3a5 5 0 1 0 4.546 2.914.5.5 0 0 1 .908-.417A6 6 0 1 1 8 2z"/>
          <path d="M8 4.466V.534a.25.25 0 0 1 .41-.192l2.36 1.966c.12.1.12.284 0 .384L8.41 4.658A.25.25 0 0 1 8 4.466"/>
        </svg>
        <span>Loading...</span>
      </div>
      <div class="tour-grid" id="destinations-container">

      </div>
      <div class="pagination" id="pagination"></div>
    </section>
  </main>

  <footer id="footer"></footer>
  <script src="js/home.js"></script>
  <script src="js/destinations.js"></script>
</body>
</html>
